[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a-stock-lens"
version = "0.1.0"
description = "Local-first A-share discovery and research lifecycle system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
data = [
    "duckdb>=1.0",
    "polars>=1.0",
    "pyarrow>=17.0",
]
providers = ["akshare>=1.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/astock_lens"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
# The approved design documents under docs/ are imported byte-for-byte from the
# reviewed design package. Their embedded Python code fences are prose, not
# source, so they must never be rewritten by the formatter.
extend-exclude = ["docs"]

[tool.mypy]
files = ["src/astock_lens"]
python_version = "3.12"
strict = true
