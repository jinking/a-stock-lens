# net_profit_parent_yoy — 归母净利润同比增速（%）
#
# 源站已经给出这个比率，这里只做"取到、标明时点、如实报告状态"，不重算也不套阈值。
# 单位：%。
name: net_profit_parent_yoy
domain: GROWTH
description: Parent net profit growth against the same period a year earlier, in percent.
inputs:
  - net_profit_parent_yoy
frequency: QUARTERLY
direction: HIGHER_MEANS_FASTER_PROFIT_GROWTH
null_policy: NULL_UNLESS_THE_METRIC_HAS_A_PUBLISHED_VALUE
version: v1
params:
  # Deferred：没有已评审的新鲜度要求，因此不触发 STALE。
  stale_after_days: null
