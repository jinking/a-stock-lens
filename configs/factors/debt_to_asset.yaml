# debt_to_asset — 资产负债率（%）
#
# 源站已经给出这个比率，这里只做"取到、标明时点、如实报告状态"，不重算也不套阈值。
# 单位：%。
name: debt_to_asset
domain: QUALITY
description: Total liabilities divided by total assets, in percent.
inputs:
  - debt_to_asset
frequency: QUARTERLY
direction: HIGHER_MEANS_MORE_LEVERAGE
null_policy: NULL_UNLESS_THE_METRIC_HAS_A_PUBLISHED_VALUE
version: v1
params:
  # Deferred：没有已评审的新鲜度要求，因此不触发 STALE。
  stale_after_days: null
