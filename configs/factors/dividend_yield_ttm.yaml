# dividend_yield_ttm — 滚动股息率（逐日表）
#
# 来自 neodata 的估值事实（逐日估值时序），时点为交易日收盘。
# 极性由策略权重决定：越高表示回报越多
name: dividend_yield_ttm
domain: VALUATION
description: Trailing dividend yield, in percent.
inputs:
  - dividend_yield_ttm
frequency: DAILY
direction: HIGHER_MEANS_MORE_INCOME_RETURNED
null_policy: NULL_UNLESS_THE_METRIC_HAS_A_PUBLISHED_VALUE
version: v1
params:
  # Deferred：没有已评审的新鲜度要求，因此不触发 STALE。
  stale_after_days: null
