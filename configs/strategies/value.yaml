id: value
enabled: true
version: v1
description: Cheapness relative to history, peers, and cash-flow quality.
# Value 的判定要素：估值（PE/PB/PS）、历史估值分位、股息率、现金流价格（市现率）
# 与盈利质量。全部来自 neodata 的估值事实 + 财报链路。
#
# 权重已于 2026-09-17 评审通过（等权）。评审依据：三套候选方案在等距抽样 40 只上
# top-8 重合 75%——"便宜"本身是相对客观的排序，换权重只挪动 2 个名字，
# 因此在没有依据说哪个维度更重要之前取等权。
#
# 负号表示极性：PE/PB/PS/市现率/历史分位都是越低越便宜；`roe_ttm` 越高越好。
# 倍数非正（负现金流、负净资产）时因子报 `NOT_APPLICABLE`，不会被当成"最便宜"。
weights:
  pe_ttm: -1.0
  pb: -1.0
  ps_ttm: -1.0
  pe_percentile: -1.0
  pcf_operating_ttm: -1.0
  roe_ttm: 1.0
required_factors:
  - pe_ttm
  - pb
  - ps_ttm
  - pe_percentile
  - pcf_operating_ttm
  - roe_ttm
# 为什么没有股息率：neodata 的「滚动股息率」列在实测抽样（40 只）里**全部为空**，
# 把它列为必需项会让 Value 永久不合格——那读起来像"市场没有便宜货"，
# 实际是"这个数据源这一列没数据"。等源站开始给出该列，再加回这里即可。
# 亏损公司没有 PE/PB：因此要求 PE/PB 会把亏损股挡在 Value 之外，
# 这与"便宜"通常的语义一致，但也确实是一条判断，记录在此。
dimensions:
  - PE/PB/PS
  - FCF yield
  - dividend yield
  - historical valuation percentile
  - industry-relative valuation
  - earnings and balance-sheet quality
