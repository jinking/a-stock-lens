# 本 workflow 是 HEAD 的独立验证通道：仓库此前完全依赖本地证据链，这里让远端对每个
# 提交复跑与本地交付门禁完全相同的命令（ruff / format / mypy / 全量 pytest）。
#
# 两个刻意选择：
# 1. `--extra data` 必装：duckdb 相关用例是 `pytest.importorskip`，缺依赖会“跳过式假绿”；
#    `providers`（akshare）extra 不装 —— 源码对 akshare 是懒加载，测试全部注入桩，装了只增耗时。
# 2. `pytest` 跑全量（含 `tests/stress`），与 Makefile 的交付前门禁一致，不做子集替代。

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web 前端验证（测试 / 类型 / 构建）
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装 Web 依赖
        working-directory: web
        run: npm ci

      - name: Web 测试
        working-directory: web
        run: npm run test

      - name: Web 类型检查
        working-directory: web
        run: npm run typecheck

      - name: Web 生产构建
        working-directory: web
        run: npm run build

  verify:
    name: 全量验证（ruff / format / mypy / pytest）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装 uv 与 Python 3.12
        # 注意：astral-sh/setup-uv 不提供浮动 v10 major tag，必须用精确版本。
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 同步依赖（锁定文件 + data extra）
        run: uv sync --frozen --extra data

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy（严格模式）
        run: uv run mypy

      - name: pytest（全量，含 tests/stress）
        run: uv run pytest -q
